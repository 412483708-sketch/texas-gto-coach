<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#091512"><link rel="manifest" href="/public/manifest.json"><link rel="apple-touch-icon" href="/public/icon.png"><title>我的锦标赛</title><link rel="stylesheet" href="/public/style.css"></head><body><main>
<header><span>♠ 桌上时光</span><span id="status">正在连接…</span></header><p id="connectionMessage" role="status"></p><nav class="buttons view-tabs"><button id="showDraft">创建比赛</button><button id="showLive">控制电视</button></nav><section id="draft"><h1>创建我的比赛</h1><p class="hint">① 设置比赛　② 扫电视二维码　③ 发送并开始</p><label for="draftName">比赛名称</label><input id="draftName" maxlength="40"><label for="draftPlayers">参赛人数</label><input id="draftPlayers" type="number" min="1" max="9999" inputmode="numeric"><h2>比赛级别</h2><p class="hint">每级可独立设置时长，前注采用大盲前注。</p><div id="draftLevels"></div><div class="buttons"><button id="addLevel">增加一级</button><button id="saveDraft">保存比赛草稿</button></div><p id="draftMessage" role="status">可以先设置比赛，扫码连接后再发送。</p><label class="scan" for="scanImage">拍摄电视二维码，连接电视</label><input id="scanImage" type="file" accept="image/*" capture="environment"><p id="scanMessage" role="status"></p><button id="sendTournament" class="primary" disabled>发送到电视并开始</button><p class="hint">可在本页面拍摄二维码，不用离开比赛草稿。</p></section><section id="live" hidden><h2>电视上的比赛</h2><h1 id="name">尚未连接</h1><p id="level">请扫描电视上的二维码</p><div id="timer">--:--</div><p id="blinds">等待电视</p><p id="next"></p><p id="feedback" role="status">连接后即可控制比赛</p>
<section id="controls"><div class="buttons"><button data-action="start" class="primary">开始</button><button data-action="pause">暂停</button><button data-action="time" data-value="-60000">− 1 分钟</button><button data-action="time" data-value="60000">＋ 1 分钟</button><button data-action="level" data-value="-1">上一级</button><button data-action="level" data-value="1">下一级</button></div><label for="players">剩余人数</label><div class="edit"><input id="players" type="number" min="0" max="9999" inputmode="numeric"><button id="setPlayers">保存人数</button></div><label for="title">比赛名称</label><div class="edit"><input id="title" maxlength="40"><button id="setName">保存名称</button></div><button data-action="reset" class="reset">重置本级</button></section><footer>手机锁屏后，电视继续计时。<br>每次操作以电视确认结果为准。</footer></section></main><script src="/public/phone.js"></script><script src="/public/draft.js"></script><script src="/public/jsQR.js"></script><script src="/public/scan.js"></script></body></html>
